name: tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - name: Install Tk + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install project (with photo extra) and coverage
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[photo]" coverage

      - name: Quality gate (compileall + coverage + metrics + mutation)
        run: xvfb-run -a python scripts/quality_gate.py --skip-unittest --html

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-gate-report
          path: |
            coverage.json
            htmlcov/
          if-no-files-found: warn

  unittest:
    name: unittest + coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - name: Install Tk + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install project (with photo extra) and coverage
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[photo]" coverage

      - name: Run full unittest suite under Xvfb
        run: |
          xvfb-run -a python -m coverage run --rcfile=.coveragerc \
            -m unittest discover -s tests -t .

      - name: Coverage report
        if: always()
        run: |
          python -m coverage report -m | tee coverage.txt
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov

      - name: Enforce coverage floor
        if: always()
        run: python -m coverage report --fail-under=95

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-ubuntu
          path: |
            coverage.txt
            coverage.xml
            htmlcov/
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Test & coverage report — ubuntu"
            echo
            echo '```'
            cat coverage.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let report = 'coverage.txt was not generated.';
            try { report = fs.readFileSync('coverage.txt', 'utf8'); } catch (e) {}
            const total = (report.match(/^TOTAL\s+.*?(\d+%)/m) || [,'?'])[1];
            const body = [
              '<!-- ulpp-coverage-report -->',
              `### Test & coverage report — ${total}`,
              '',
              '```',
              report.trim(),
              '```',
              '',
              `Artifacts: **coverage-report** (HTML + XML) on [this run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}).`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const previous = comments.data.find(c => c.body && c.body.includes('<!-- ulpp-coverage-report -->'));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  unittest-macos:
    name: unittest + coverage (macos)
    runs-on: macos-latest
    timeout-minutes: 25
    # macOS 官方 runner 经常排队 30 分钟拿不到机器（"not acquired by hosted
    # runner"）；PR 上允许它先跑着不阻塞合并，push 到 main 时仍是硬门槛。
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - name: Check Tk availability
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install project (with photo extra) and coverage
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[photo]" coverage

      - name: Run full unittest suite
        run: |
          python -m coverage run --rcfile=.coveragerc \
            -m unittest discover -s tests -t .

      - name: Coverage report
        if: always()
        run: |
          python -m coverage report -m | tee coverage.txt
          python -m coverage html -d htmlcov

      - name: Enforce coverage floor
        if: always()
        run: python -m coverage report --fail-under=95

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-macos
          path: |
            coverage.txt
            htmlcov/
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Test & coverage report — macOS"
            echo
            echo '```'
            cat coverage.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
